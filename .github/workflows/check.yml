name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Active repository preflight
        run: node scripts/check-active-repository.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: check
        run: pnpm check

      - name: Write GF-001 evidence
        run: pnpm evidence:write

      - name: Retain GF-001 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gf-001-evidence-${{ github.sha }}
          path: artifacts/gf-001/evidence.json
          if-no-files-found: error
          retention-days: 90
