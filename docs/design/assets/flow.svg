<svg width="680" height="380" viewBox="0 0 680 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>How a jig run flows: bootstrap then the core loop</title>
<desc>A run starts at drive, passes through the bootstrap/init phase (load, validate, bind, wire, identify) which can reject an invalid plan, then enters the core loop (drive each work item, fence, record, land), which calls the abstracted providers, escalates to the doorbell, writes to run records, and ends completed or stopped.</desc>
<style>
  text{font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif}
  .t{font-size:14px;fill:#2C2C2A}
  .ts{font-size:12px;fill:#5F5E5A}
  .th{font-size:14px;font-weight:500;fill:#2C2C2A}
  .arr{stroke:#888780;stroke-width:1.5;fill:none}
  .c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th,.c-purple .t{fill:#26215C}.c-purple .ts{fill:#3C3489}
  .c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th,.c-teal .t{fill:#04342C}.c-teal .ts{fill:#085041}
  .c-coral>rect{fill:#FAECE7;stroke:#993C1D}.c-coral .th,.c-coral .t{fill:#4A1B0C}.c-coral .ts{fill:#712B13}
  .c-gray>rect{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th,.c-gray .t{fill:#2C2C2A}.c-gray .ts{fill:#444441}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="c-gray"><rect x="272" y="24" width="136" height="42" rx="8"/><text class="th" x="340" y="44" text-anchor="middle">Drive run</text><text class="ts" x="340" y="58" text-anchor="middle">preview / start</text></g>

<g class="c-purple"><rect x="250" y="92" width="180" height="60" rx="8"/><text class="th" x="340" y="114" text-anchor="middle">Bootstrap / init</text><text class="ts" text-anchor="middle"><tspan x="340" y="130">load, validate, bind,</tspan><tspan x="340" y="144">wire, identify, ready</tspan></text></g>

<g class="c-teal"><rect x="250" y="192" width="180" height="60" rx="8"/><text class="th" x="340" y="214" text-anchor="middle">Core loop</text><text class="ts" text-anchor="middle"><tspan x="340" y="230">drive each work item,</tspan><tspan x="340" y="244">fence, record, land</tspan></text></g>

<g class="c-gray"><rect x="272" y="292" width="136" height="42" rx="8"/><text class="th" x="340" y="312" text-anchor="middle">Run completed</text><text class="ts" x="340" y="326" text-anchor="middle">or stopped</text></g>

<g class="c-gray"><rect x="470" y="92" width="170" height="60" rx="8"/><text class="th" x="555" y="114" text-anchor="middle">Run records</text><text class="ts" text-anchor="middle"><tspan x="555" y="130">append-only;</tspan><tspan x="555" y="144">every phase writes</tspan></text></g>

<g class="c-coral"><rect x="470" y="192" width="170" height="60" rx="8"/><text class="th" x="555" y="214" text-anchor="middle">Providers (seams)</text><text class="ts" text-anchor="middle"><tspan x="555" y="230">abstracted: agent,</tspan><tspan x="555" y="244">host, forge, source</tspan></text></g>

<g class="c-gray"><rect x="40" y="100" width="150" height="44" rx="8"/><text class="th" x="115" y="122" text-anchor="middle">Plan rejected</text><text class="ts" x="115" y="136" text-anchor="middle">no run</text></g>

<g class="c-gray"><rect x="40" y="200" width="150" height="44" rx="8"/><text class="th" x="115" y="222" text-anchor="middle">Doorbell</text><text class="ts" x="115" y="236" text-anchor="middle">owner decides</text></g>

<line class="arr" x1="340" y1="66" x2="340" y2="92" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="152" x2="340" y2="192" marker-end="url(#arrow)"/>
<line class="arr" x1="340" y1="252" x2="340" y2="292" marker-end="url(#arrow)"/>

<line class="arr" x1="430" y1="122" x2="470" y2="122" marker-end="url(#arrow)" style="stroke-dasharray:5 3"/>
<text class="ts" x="450" y="116" text-anchor="middle">writes</text>
<line class="arr" x1="430" y1="206" x2="476" y2="152" marker-end="url(#arrow)" style="stroke-dasharray:5 3"/>
<line class="arr" x1="430" y1="222" x2="470" y2="222" marker-start="url(#arrow)" marker-end="url(#arrow)" style="stroke-dasharray:5 3"/>

<line class="arr" x1="250" y1="122" x2="190" y2="122" marker-end="url(#arrow)" style="stroke-dasharray:5 3"/>
<text class="ts" x="220" y="116" text-anchor="middle">invalid</text>
<line class="arr" x1="250" y1="222" x2="190" y2="222" marker-start="url(#arrow)" marker-end="url(#arrow)" style="stroke-dasharray:5 3"/>
<text class="ts" x="220" y="216" text-anchor="middle">route</text>

<g class="c-purple"><rect x="214" y="348" width="13" height="13" rx="3"/></g>
<text class="ts" x="232" y="358">bootstrap phase</text>
<g class="c-teal"><rect x="350" y="348" width="13" height="13" rx="3"/></g>
<text class="ts" x="368" y="358">core phase</text>
<g class="c-coral"><rect x="462" y="348" width="13" height="13" rx="3"/></g>
<text class="ts" x="480" y="358">providers</text>
</svg>
